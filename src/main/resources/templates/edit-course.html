<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Course - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/dashboard-style.css}" rel="stylesheet">
</head>

<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div th:replace="~{fragments/layouts :: sidebar('edit-course')}"></div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav th:replace="~{fragments/layouts :: navbar}"></nav>

            <div class="container-fluid px-4 py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Edit Course</h2>
                    <a th:href="@{/course/list}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i> Back to
                        List</a>
                </div>

                <div class="card mb-4">
                    <div class="card-header bg-white">
                        <i class="bi bi-pencil-square me-1"></i> Edit Course Details
                    </div>
                    <div class="card-body">
                        <form th:action="@{/course/{id}/edit(id=${course.id})}" th:object="${course}" th:method="put">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="courseName" class="form-label">Course Name</label>
                                    <input th:field="*{courseName}" type="text" class="form-control" id="courseName">
                                </div>
                                <div class="col-md-6">
                                    <label for="courseCode" class="form-label">Course Code</label>
                                    <input th:field="*{courseCode}" th:classappend="${#fields.hasErrors('courseCode')} ? 'is-invalid' : ''"  type="text" class="form-control" id="courseCode">
                                    <p style="color:red" th:if="${#fields.hasErrors('courseCode')}"
                                       th:errors="*{courseCode}"></p>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="duration" class="form-label">Duration</label>
                                    <input th:field="*{duration}" type="text" class="form-control" id="duration">
                                </div>
                                <div class="col-md-6">
                                    <label for="courseFee" class="form-label">Course Fee</label>
                                    <input th:field="*{fee}" type="text" class="form-control" id="courseFee">
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="isActive" class="form-label">Is Active</label>
                                    <select th:field="*{active}" id="isActive" class="form-select">
                                        <option th:value="true">Yes</option>
                                        <option th:value="false">No</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea th:field="*{description}" class="form-control" id="description"
                                    rows="4"></textarea>
                            </div>
                            <div class="d-flex justify-content-end">
                                <button type="button" class="btn btn-light me-2"
                                    onclick="history.back()">Cancel</button>
                                <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Update
                                    Course</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <th:block th:replace="~{fragments/layouts :: scripts}"></th:block>
</body>

</html>
