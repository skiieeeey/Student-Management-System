<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management - Student Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/dashboard-style.css}" rel="stylesheet">
</head>

<body>
<div class="d-flex" id="wrapper">

    <!-- Reusable Sidebar Fragment (Passing 'courses' active indicator) -->
    <div th:replace="~{fragments/layouts :: sidebar('courses')}"></div>

    <!-- Page Content Wrapper -->
    <div id="page-content-wrapper" class="d-flex flex-column min-vh-100 bg-light-subtle">

        <!-- Reusable Top Navigation Bar Fragment -->
        <nav th:replace="~{fragments/layouts :: navbar}"></nav>

        <!-- Main Workspace Container -->
        <main class="container-fluid px-4 py-4 flex-grow-1">

            <!-- Page Title & Primary Action Header -->
            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4 gap-2">
                <div>
                    <h3 class="fw-bold text-dark mb-0">Course Management</h3>
                    <p class="text-muted small mb-0">Manage course catalogs, fees, and academic durations.</p>
                </div>
                <a th:href="@{/course/add}" class="btn btn-primary d-flex align-items-center gap-1 shadow-sm align-self-start align-self-sm-auto">
                    <i class="bi bi-plus-lg"></i>
                    <span>Add New Course</span>
                </a>
            </div>

            <div th:if="${message}" class="alert-box alert-success fade-out" role="alert" th:text="${message}"></div>

            <!-- Courses Table Card -->
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-white border-bottom py-3 d-flex align-items-center justify-content-between px-4">
                    <h6 class="fw-bold text-dark mb-0">
                        <i class="bi bi-book me-2 text-primary"></i>Course List
                    </h6>
                    <span th:text="'Total:' + ${courses.totalElements}" class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill"></span>
                </div>

                <div class="card-body p-0">
<!--                    <div class="text-muted" th:if="${courses.content.isEmpty()}">No course found</div>-->
                    <div class="table-responsive" th:if="${!courses.content.isEmpty()}">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light border-bottom border-top-0">
                                <tr class="text-uppercase text-muted fs-7">
                                    <th class="ps-4">ID</th>
                                    <th>Course Name</th>
                                    <th>Code</th>
                                    <th>Fees</th>
                                    <th>Duration</th>
                                    <th class="pe-4 text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="course : ${courses.content}">
                                    <td th:text="${course.id}" class="ps-4 fw-semibold text-secondary"></td>
                                    <td>
                                        <span th:text="${course.courseName}" class="fw-bold text-dark"></span>
                                    </td>
                                    <td>
                                        <span th:text="${course.courseCode}" class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill"></span>
                                    </td>
                                    <td th:text="${course.fee}" class="fw-semibold text-dark"></td>
                                    <td th:text="${course.duration}" class="text-muted"></td>
                                    <td class="pe-4 text-end">
                                        <div class="btn-group btn-group-sm" role="group">
                                            <a th:href="@{'/course/' + ${course.id}}" class="btn btn-light border text-secondary" title="View Course Details">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            <a th:href="@{/course/{id}/edit(id=${course.id})}" class="btn btn-light border text-primary" title="Edit Course">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Card Pagination Footer -->
                <div class="card-footer bg-white border-top py-3 px-4">
                    <!-- 1. Ensure the courses object exists before attempting to select fields from it -->
                    <div th:if="${courses != null}" th:object="${courses}" class="d-flex flex-column flex-sm-row align-items-center justify-content-between gap-2">

                        <!-- 2. Safe presentation showing exact math blocks via separate Standard Expressions -->
                        <span th:if="${courses.totalElements > 0}" class="small text-muted">
                            Showing <span th:text="*{number * size + 1}"></span> to
                                <span th:text="*{number * size + numberOfElements}"></span> of
                                <span th:text="*{totalElements}"></span> entries
                        </span>

                        <span th:if="${courses.totalElements == 0}" class="small text-muted">
                            No entries found
                        </span>

                        <nav th:if="${courses.totalPages > 1}" aria-label="Course navigation">
                            <ul class="pagination pagination-sm mb-0">
                                <!--Previous-->
                                <li th:classappend="${courses.hasPrevious()} ? '' : 'disabled'" class="page-item">
                                    <a class="page-link" th:href="@{/course/list(page=${courses.number - 1}, size=${courses.size})}">Previous</a>
                                </li>

                                <!--Page numbers-->
                                <li th:each="i : ${#numbers.sequence(0, courses.totalPages > 0 ? courses.totalPages - 1 : 0)}"
                                    th:classappend="${i} == ${courses.number} ? 'active'" class="page-item">
                                    <a class="page-link"
                                       th:href="@{/course/list(page=${i}, size=${courses.size})}"
                                       th:text="${i + 1}"></a>
                                </li>

                                <!--Next-->
                                <li th:classappend="${courses.hasNext()} ? '' : 'disabled'" class="page-item">
                                    <a class="page-link" th:href="@{/course/list(page=${courses.number + 1}, size=${courses.size})}">Next</a>
                                </li>
                            </ul>
                        </nav>
                    </div>

                    <!-- 3. Safe fallback block if the 'courses' attribute is completely absent from the Spring Model -->
                    <div th:if="${courses == null}" class="text-center py-2 text-muted small">
                        No course data available.
                    </div>
                </div>

            </div>

        </main>

        <!-- Reusable Footer Fragment -->
        <footer th:replace="~{fragments/layouts :: footer}"></footer>
    </div>
</div>

<!-- Bootstrap 5 Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Sidebar Toggle Event Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const sidebarToggle = document.querySelector('#sidebarToggle');
        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', event => {
                event.preventDefault();
                document.body.classList.toggle('sb-sidenav-toggled');
            });
        }
    });
</script>
</body>

</html>
