<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/dashboard-style.css}" rel="stylesheet">
</head>

<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div th:replace="~{fragments/layouts::sidebar('students')}"></div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav th:replace="~{fragments/layouts::navbar}"></nav>

            <div class="container-fluid px-4 py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Add New Student</h2>
                    <a th:href="@{/student/list}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i> Back to
                        List</a>
                </div>

                <div class="card mb-4">
                    <div class="card-header bg-white">
                        <i class="bi bi-person-plus me-1"></i> Student Details
                    </div>
                    <div class="card-body">
                        <form th:action="@{/student/add}" method="post" th:object="${student}">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="firstName" class="form-label">First Name</label>
                                    <input th:field="*{firstName}" th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''" type="text" class="form-control" id="firstName" placeholder="e.g. John"
                                        required>
                                    <p style="color:red" class="fade-out" th:if="${#fields.hasErrors('firstName')}"
                                       th:errors="*{firstName}"></p>
                                </div>
                                <div class="col-md-6">
                                    <label for="lastName" class="form-label">Last Name</label>
                                    <input th:field="*{lastName}" th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''" type="text" class="form-control" id="lastName" placeholder="e.g. Doe"
                                        required>
                                    <p style="color:red" class="fade-out" th:if="${#fields.hasErrors('lastName')}"
                                       th:errors="*{lastName}"></p>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="email" class="form-label">Email Address</label>
                                    <input th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" type="email" class="form-control" id="email"
                                        placeholder="e.g. john.doe@example.com" required>
                                    <p style="color:red" class="fade-out" th:if="${#fields.hasErrors('email')}"
                                       th:errors="*{email}"></p>
                                </div>
                                <div class="col-md-6">
                                    <label for="phone" class="form-label">Phone Number</label>
                                    <input th:field="*{phone}" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''" class="form-control" id="phone"
                                        placeholder="e.g. 6578898900">
                                    <p style="color:red" class="fade-out" th:if="${#fields.hasErrors('phone')}"
                                       th:errors="*{phone}"></p>
                                </div>
                            </div>
<!--                            <div class="mb-3">-->
<!--                                <label for="address" class="form-label">Address</label>-->
<!--                                <textarea class="form-control" id="address" rows="3"-->
<!--                                    placeholder="Enter full address..."></textarea>-->
<!--                            </div>-->
                            <div class="d-flex justify-content-end">
                                <button type="reset" class="btn btn-light me-2">Reset</button>
                                <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Save
                                    Student</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', event => {
            const sidebarToggle = document.body.querySelector('#sidebarToggle');
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', event => {
                    event.preventDefault();
                    document.body.classList.toggle('sb-sidenav-toggled');
                });
            }
        });
    </script>
</body>

</html>
