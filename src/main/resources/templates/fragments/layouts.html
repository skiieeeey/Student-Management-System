<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Fragment: Sidebar Navigation -->
<aside th:fragment="sidebar(activePage)" id="sidebar-wrapper" class="bg-dark text-white border-end border-secondary border-opacity-25">
    <div class="sidebar-heading px-4 py-3 d-flex align-items-center gap-2 border-bottom border-secondary border-opacity-25">
        <i class="bi bi-mortarboard-fill text-primary fs-4"></i>
        <span class="fw-bold fs-5 tracking-tight text-white">SMS Admin</span>
    </div>

    <div class="list-group list-group-flush py-3">
        <a th:href="@{/dashboard}" class="sidebar-link px-4 py-2-5 text-decoration-none d-flex align-items-center gap-3"
           th:classappend="${activePage == 'dashboard'} ? 'active' : ''">
            <i class="bi bi-grid-1x2-fill"></i> <span>Dashboard</span>
        </a>
        <a th:href="@{/course/list}" class="sidebar-link px-4 py-2-5 text-decoration-none d-flex align-items-center gap-3"
           th:classappend="${activePage == 'courses'} ? 'active' : ''">
            <i class="bi bi-book-half"></i> <span>Courses</span>
        </a>
        <a th:href="@{/students}" class="sidebar-link px-4 py-2-5 text-decoration-none d-flex align-items-center gap-3"
           th:classappend="${activePage == 'students'} ? 'active' : ''">
            <i class="bi bi-people-fill"></i> <span>Students</span>
        </a>
        <a th:href="@{/enrollment}" class="sidebar-link px-4 py-2-5 text-decoration-none d-flex align-items-center gap-3"
           th:classappend="${activePage == 'enroll'} ? 'active' : ''">
            <i class="bi bi-person-plus-fill"></i> <span>Enrollment</span>
        </a>
    </div>

    <!-- Sidebar Footer / Logout -->
    <div class="mt-auto p-3 border-top border-secondary border-opacity-25">
        <a th:href="@{/logout}" class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center gap-2 rounded-2">
            <i class="bi bi-box-arrow-right"></i> <span>Logout</span>
        </a>
    </div>
</aside>

<!-- Fragment: Scripts -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sidebarToggle = document.querySelector('#sidebarToggle');
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', event => {
                    event.preventDefault();
                    document.body.classList.toggle('sb-sidenav-toggled');
                });
            }
        });
    </script>
</th:block>
