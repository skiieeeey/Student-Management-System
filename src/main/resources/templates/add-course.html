<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div th:replace="~{fragments/layouts::sidebar('courses')}"></div>

        <!-- Page Content -->
        <div id="page-content-wrapper">

            <nav th:replace="~{fragments/layouts::navbar}"></nav>

            <div class="container-fluid px-4 py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Add New Course</h2>
                    <a th:href="@{/course/list}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i> Back to
                        List</a>
                </div>

                <div class="card mb-4">
                    <div class="card-header bg-white">
                        <i class="bi bi-plus-circle me-1"></i> Course Details
                    </div>
                    <div class="card-body">
                        <form th:action="@{/course/add}" method="post" th:object="${course}">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="courseName" class="form-label">Course Name</label>
                                    <input th:field="*{courseName}" type="text" class="form-control" id="courseName"
                                        placeholder="e.g. Web Development" required>
                                    <p style="color:red" th:if="${#fields.hasErrors('courseName')}"
                                         th:errors="*{courseName}"></p>
                                </div>
                                <div class="col-md-6">
                                    <label for="courseCode" class="form-label">Course Code</label>
                                    <input th:field="*{courseCode}" th:classappend="${#fields.hasErrors('courseCode')} ? 'is-invalid' : ''" type="text" class="form-control" id="courseCode" placeholder="e.g. WEB101"
                                        required>
                                    <p style="color:red" th:if="${#fields.hasErrors('courseCode')}"
                                         th:errors="*{courseCode}"></p>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="duration" class="form-label">Duration</label>
                                    <input th:field="*{duration}" type="text" class="form-control" id="duration" placeholder="e.g. 6 Months, 2 Yrs"
                                        required>
                                    <p style="color:red" th:if="${#fields.hasErrors('duration')}"
                                         th:errors="*{duration}"></p>
                                </div>
                                <div class="col-md-6">
                                    <label for="fee" class="form-label">Course Fee</label>
                                    <input th:field="*{fee}" type="number" class="form-control" id="fee" placeholder="e.g. 1200"
                                        required>
                                    <p style="color:red" th:if="${#fields.hasErrors('fee')}"
                                         th:errors="*{fee}"></p>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea th:field="*{description}" class="form-control" id="description" rows="4"
                                    placeholder="Enter course description..."></textarea>
                                <p style="color:red" th:if="${#fields.hasErrors('description')}"
                                     th:errors="*{description}"></p>
                            </div>
                            <div class="d-flex justify-content-end">
                                <button type="reset" class="btn btn-light me-2">Reset</button>
                                <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Save
                                    Course</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', event => {
            const sidebarToggle = document.body.querySelector('#sidebarToggle');
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', event => {
                    event.preventDefault();
                    document.body.classList.toggle('sb-sidenav-toggled');
                });
            }
        });
    </script>
</body>

</html>
