<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Course - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/dashboard-style.css}" rel="stylesheet">
</head>

<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div th:replace="~{fragments/layouts :: sidebar('dashboard')}"></div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav th:replace="~{fragments/layouts :: navbar}"></nav>

            <div class="container-fluid px-4 py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Course Details</h2>
                    <a th:href="@{/course/list}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i> Back to
                        List</a>
                </div>

                <div class="card mb-4">
                    <div class="card-header bg-white">
                        <i class="bi bi-info-circle me-1"></i> Information
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-3 fw-bold">Course Name:</div>
                            <div class="col-md-9" th:text="${course.courseName}"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-3 fw-bold">Course Code:</div>
                            <div class="col-md-9" th:text="${course.courseCode}"></div>
                        </div>
						 <div class="row mb-3">
                            <div class="col-md-3 fw-bold">Course Fee:</div>
                            <div class="col-md-9" th:text="${course.fee}"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-3 fw-bold">Duration:</div>
                            <div class="col-md-9" th:text="${course.duration}"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-3 fw-bold">Is Active:</div>
                            <div class="col-md-9" th:text="${course.active}"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-3 fw-bold">Description:</div>
                            <div class="col-md-9">
                                <p th:text="${course.description}"></p>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer bg-white">
                        <a th:href="@{/course/{id}/edit(id=${course.id})}" class="btn btn-warning text-white"><i class="bi bi-pencil me-1"></i>
                            Edit Course</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <th:block th:replace="~{fragments/layouts :: scripts}"></th:block>
</body>

</html>
