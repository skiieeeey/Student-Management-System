<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Student - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/dashboard-style.css}" rel="stylesheet">
</head>

<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div th:replace="~{fragments/layouts :: sidebar('students')}"></div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav th:replace="~{fragments/layouts :: navbar}"></nav>

            <div class="container-fluid px-4 py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Student Details</h2>
                    <a th:href="@{/student/list}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i> Back to
                        List</a>
                </div>

                <div class="card mb-4">
                    <div class="card-header bg-white">
                        <i class="bi bi-person-lines-fill me-1"></i> Information
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-3 fw-bold">Full Name:</div>
                            <div th:text="${student.firstName} + ' ' + ${student.lastName}" class="col-md-9"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-3 fw-bold">Email Address:</div>
                            <div th:text="${student.email}" class="col-md-9"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-3 fw-bold">Phone Number:</div>
                            <div th:text="${student.phone}" class="col-md-9"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-3 fw-bold">Is Active:</div>
                            <div th:text="${student.active}" class="col-md-9"></div>
                        </div>
<!--                        <div class="row mb-3">-->
<!--                            <div class="col-md-3 fw-bold">Address:</div>-->
<!--                            <div class="col-md-9">123 Main St, Springfield, IL 62704</div>-->
<!--                        </div>-->
                    </div>
                    <div class="card-footer bg-white">
                        <a th:href="@{/student/{id}/edit(id=${student.id})}" class="btn btn-warning text-white"><i class="bi bi-pencil me-1"></i>
                            Edit Course</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <th:block th:replace="~{fragments/layouts :: scripts}"></th:block>
</body>

</html>
